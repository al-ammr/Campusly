name: Campusly CI Pipeline

on:
  push:
    branches: [main, 'bp-*', 'feat/*', 'fix/*']
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    name: Typecheck, Lint, Tests, and Build Verification
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/campusly_test"
      REDIS_URL: "redis://localhost:6379"
      SESSION_SECRET: "test_secret_key_minimum_32_characters_for_ci_pipeline"
      JOB_SECRET: "test_job_secret_key_minimum_32_chars"
      DATA_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      STORAGE_ENDPOINT: "https://mock.storage.local"
      STORAGE_ACCESS_KEY_ID: "mock_key"
      STORAGE_SECRET_ACCESS_KEY: "mock_secret"
      STORAGE_BUCKET_NAME: "test-bucket"
      NEXT_PUBLIC_APP_URL: "https://campusly.abu.edu.ng"
      NEXT_PUBLIC_DEFAULT_CAMPUS_SLUG: "abu-zaria"
      NEXT_PUBLIC_BUILD_ID: "ci-build"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security & Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Code Formatting Check (Prettier)
        run: npm run format:check

      - name: Static Lint Verification (ESLint)
        run: npm run lint

      - name: Strict Typecheck (TypeScript)
        run: npm run typecheck

      - name: Run Test Suite (Vitest)
        run: npm run test

      - name: Next.js Production Build
        run: npm run build
